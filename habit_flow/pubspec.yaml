name: habit_flow
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Functional Programming & Utils
  fpdart: ^1.1.0
  uuid: ^4.4.0
  intl: ^0.19.0
  shared_preferences: ^2.3.2

  # Code Gen Annotations
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # UI
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Lints
  flutter_lints: ^4.0.0
  custom_lint: ^0.7.6
  riverpod_lint: ^2.6.2

  # Code Gen
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  freezed: ^3.0.0
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
